<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c" />
      <stop offset="55%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Heart Shape -->
  <path
    d="M32 55 C15 41 5 27 5 17 C5 9 10.8 3.5 18.5 3.5 C24.2 3.5 29 7 32 12 C35 7 39.8 3.5 45.5 3.5 C53.2 3.5 59 9 59 17 C59 27 49 41 32 55 Z"
    fill="url(#heartGrad)"
    filter="url(#favGlow)"
  />

  <!-- ECG / Pulse Line -->
  <path
    d="M 11 29 L 20 29 L 24 20 L 29 40 L 35 15 L 40 37 L 44 29 L 53 29"
    stroke="#ffffff"
    stroke-width="3.5"
    stroke-linecap="round"
